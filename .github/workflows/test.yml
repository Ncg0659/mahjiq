name: Testler

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  engine:
    name: Oyun motoru testleri
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  ui:
    name: Tarayıcı testleri (dokunmatik + ekran boyutları)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.49.1 && python -m playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8080 &
          sleep 1
          python3 tests/ui/test_ui.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ekran-goruntuleri
          path: tests/ui/screens/
